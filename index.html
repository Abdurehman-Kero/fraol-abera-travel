<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
            if (!desc || !desc.set) {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return origFetch; },
                set: function(val) { origFetch = val; }
              });
            }
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
